product: jvm/lib
description: "site.addzero:yudao-spring-boot-starter-biz-ip"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/yudao-java-starter.module-template.yaml

dependencies:
  - //toolchain/modules/yudao3-yudao-common:
      exported: true
  - $libs.yudao.ip2region:
      exported: true
  - $libs.yudao.slf4j.api:
      scope: compile-only

settings:
  publishing:
    enabled: false
    group: site.addzero
    artifactId: yudao-spring-boot-starter-biz-ip
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-spring-boot-starter-biz-ip
      description: "site.addzero:yudao-spring-boot-starter-biz-ip"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
