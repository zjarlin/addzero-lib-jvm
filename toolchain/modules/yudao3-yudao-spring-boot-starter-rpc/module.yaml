product: jvm/lib
description: "site.addzero:yudao-spring-boot-starter-rpc"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/yudao-java-starter.module-template.yaml

dependencies:
  - //toolchain/modules/yudao3-yudao-common:
      exported: true
  - $libs.yudao.spring.cloud.starter.loadbalancer:
      exported: true
  - $libs.yudao.spring.cloud.starter.openfeign:
      exported: true
  - $libs.yudao.feign.okhttp:
      exported: true
  - $libs.yudao.jakarta.validation.api:
      exported: true

settings:
  publishing:
    enabled: false
    group: site.addzero
    artifactId: yudao-spring-boot-starter-rpc
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-spring-boot-starter-rpc
      description: "site.addzero:yudao-spring-boot-starter-rpc"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
