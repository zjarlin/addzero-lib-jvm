product:
  type: kmp/lib
  platforms: [jvm]
description: "site.addzero:ksp-easycode-jimmer"

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.serialization.json
  - //modules/tool-json
  - bom: $libs.io.insert.koin.koin.bom
  - $libs.io.insert.koin.koin.annotations
  - $libs.io.insert.koin.koin.core
  - $libs.com.google.devtools.ksp.symbol.processing.api
  - //modules/ksp-easycode
  - $libs.site.addzero.entity2analysed.support
  - $libs.site.addzero.tool.koin.v2025
  - $libs.org.apache.velocity.velocity.engine.core

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: ksp-easycode-jimmer
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: ksp-easycode-jimmer
      description: "site.addzero:ksp-easycode-jimmer"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
    serialization: enabled
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: $libs.io.insert.koin.koin.compiler.plugin
        options:
          compileSafety: "false"
          debugLogs: "false"
          skipDefaultValues: "true"
          unsafeDslChecks: "true"
          userLogs: "true"
  jvm:
    jdk:
      version: 17
    release: 17
