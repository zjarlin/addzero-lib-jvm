product:
  type: kmp/lib
  platforms: [jvm, wasmJs]
description: "Modbus 注解、编码工具、传输配置模型，以及 RTU/TCP/MQTT 运行时抽象都在这个模块里。"

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - bom: $libs.io.insert.koin.koin.bom
  - $libs.io.insert.koin.koin.annotations
  - $libs.io.insert.koin.koin.core
  - $libs.org.jetbrains.kotlinx.kotlinx.serialization.json

dependencies@jvm:
  - $libs.tool.modbus:
      exported: true
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.core

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

test-dependencies@jvm:
  - $libs.org.junit.jupiter.junit.jupiter

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: modbus-runtime
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: modbus-runtime
      description: "Modbus 注解、编码工具、传输配置模型，以及 RTU/TCP/MQTT 运行时抽象都在这个模块里。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
    serialization: enabled
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: $libs.io.insert.koin.koin.compiler.plugin
        options:
          compileSafety: "false"
          debugLogs: "false"
          skipDefaultValues: "true"
          unsafeDslChecks: "true"
          userLogs: "true"
  jvm:
    jdk:
      version: 17
    release: 17
