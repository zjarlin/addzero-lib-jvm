product:
  type: kmp/lib
  platforms: [jvm]
description: "`route-processor` 用于收集 `@Route` 元数据，并在多模块场景下按 owner/contributor 模式聚合生成路由代码："

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - $libs.com.google.devtools.ksp.symbol.processing.api
  - //modules/route-core:
      exported: true
  - //modules/tool-str

dependencies@jvm:
  - site.addzero:tool-io-codegen:2026.08.11

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

plugins:
  processor-settings-build:
    enabled: true
    packageName: site.addzero.route.processor.context.generated
    style: context
    settingsClassName: Settings
    contextClassName: SettingContext
    properties:
      "sharedSourceDir": ""
      "routeGenPkg": "site.addzero.generated"
      "routeOwnerModule": ""
      "routeAggregationRole": "contributor"

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: route-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: route-processor
      description: "`route-processor` 用于收集 `@Route` 元数据，并在多模块场景下按 owner/contributor 模式聚合生成路由代码："
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
  jvm:
    jdk:
      version: 17
    release: 17
