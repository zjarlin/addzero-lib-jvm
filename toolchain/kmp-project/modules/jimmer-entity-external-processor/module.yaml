product:
  type: kmp/lib
  platforms: [jvm]
description: "site.addzero:jimmer-entity-external-processor"

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - site.addzero:jimmer-entity-spi:2026.08.11
  - //modules/tool-coll
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.core
  - $libs.androidx.room.compiler.processing
  - //modules/entity2form-processor
  - //modules/entity2iso-processor
  - //modules/entity2mcp-processor
  - $libs.com.google.devtools.ksp.symbol.processing.api

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

plugins:
  processor-settings-build:
    enabled: true
    packageName: site.addzero.jimmer.entity.external.processor.context.generated
    style: context
    settingsClassName: Settings
    contextClassName: SettingContext
    properties:
      "isomorphicPkg": "site.addzero.generated.isomorphic"
      "isomorphicGenDir": ""
      "sharedSourceDir": ""
      "sharedComposeSourceDir": ""
      "backendServerSourceDir": ""
      "isomorphicPackageName": "site.addzero.generated.isomorphic"
      "isomorphicClassSuffix": "Iso"
      "isomorphicSerializableEnabled": "true"
      "entity2Iso.enabled": "true"
      "entity2Form.enabled": "true"
      "entity2Mcp.enabled": "true"
      "formPackageName": "site.addzero.generated.forms"
      "enumOutputPackage": "site.addzero.generated.enums"
      "apiClientPackageName": "site.addzero.generated.api"
      "iso2DataProviderPackage": "site.addzero.generated.forms.dataprovider"
      "mcpPackageName": "site.addzero.generated.mcp"

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: jimmer-entity-external-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: jimmer-entity-external-processor
      description: "site.addzero:jimmer-entity-external-processor"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
  jvm:
    jdk:
      version: 17
    release: 17
