product:
  type: kmp/lib
  platforms: [jvm]
description: "Compose Props Processor 是一个基于 KSP (Kotlin Symbol Processing) 的代码生成工具，用于为 Compose 函数自动生成辅助工具集，包括状态管理类、remember 函数和 Widget 函数等。"

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - $libs.com.google.devtools.ksp.symbol.processing.api
  - site.addzero:lsi-ksp:2026.08.11
  - //modules/compose-props-annotations

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

plugins:
  processor-settings-build:
    enabled: true
    packageName: site.addzero.composeprops.processor.context.generated
    style: context
    settingsClassName: Settings
    contextClassName: SettingContext
    properties:
      "COMPOSE_ATTRS_SUFFIX": "State"

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: compose-props-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: compose-props-processor
      description: "Compose Props Processor 是一个基于 KSP (Kotlin Symbol Processing) 的代码生成工具，用于为 Compose 函数自动生成辅助工具集，包括状态管理类、remember 函数和 Widget 函数等。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
  jvm:
    jdk:
      version: 17
    release: 17
