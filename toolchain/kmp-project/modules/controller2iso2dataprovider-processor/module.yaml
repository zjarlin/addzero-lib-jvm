product:
  type: kmp/lib
  platforms: [jvm]
description: "`controller2iso2dataprovider-processor` is raw-KSP only. The old sibling consumer plugin is removed."

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - $libs.com.google.devtools.ksp.symbol.processing.api

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

plugins:
  processor-settings-build:
    enabled: true
    packageName: site.addzero.controller2iso2dataprovider.processor.context.generated
    style: context
    settingsClassName: Settings
    contextClassName: SettingContext
    properties:
      "sharedComposeSourceDir": ""
      "iso2DataProviderPackage": "site.addzero.generated.forms.dataprovider"
      "apiClientPackageName": "site.addzero.generated.api"
      "apiClientAggregatorObjectName": "Apis"
      "isomorphicPackageName": "site.addzero.generated.isomorphic"

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: controller2iso2dataprovider-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: controller2iso2dataprovider-processor
      description: "`controller2iso2dataprovider-processor` is raw-KSP only. The old sibling consumer plugin is removed."
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
  jvm:
    jdk:
      version: 17
    release: 17
