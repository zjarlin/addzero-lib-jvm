product:
  type: kmp/lib
  platforms: [jvm, wasmJs]
description: "Compose Desktop 工作台窗口宿主增强模块，当前主要封装 macOS 沉浸式标题栏与 `WorkbenchWindowFrame` 注入。"

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
    publish: true
  - id: huawei-maven-central
    url: https://mirrors.huaweicloud.com/repository/maven

dependencies:
  - $libs.org.jetbrains.compose.runtime.runtime
  - $libs.org.jetbrains.compose.foundation.foundation
  - $libs.org.jetbrains.compose.ui.ui
  - $libs.org.jetbrains.compose.material3.material3
  - $libs.org.jetbrains.compose.material.material.icons.extended
  - $libs.org.jetbrains.compose.components.components.resources
  - $libs.org.jetbrains.compose.ui.ui.tooling.preview
  - $libs.org.jetbrains.androidx.lifecycle.lifecycle.viewmodel.compose
  - $libs.org.jetbrains.androidx.lifecycle.lifecycle.runtime.compose
  - $libs.io.insert.koin.koin.annotations

dependencies@jvm:
  - //modules/app-sidebar

test-dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.test
  - $libs.io.kotest.kotest.property
  - $libs.io.kotest.kotest.assertions.core

test-dependencies@jvm:
  - $compose.desktop.currentOs

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: compose-workbench-immersive-desktop
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: compose-workbench-immersive-desktop
      description: "Compose Desktop 工作台窗口宿主增强模块，当前主要封装 macOS 沉浸式标题栏与 `WorkbenchWindowFrame` 注入。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    version: 2.3.21
    freeCompilerArgs:
      - -Xexpect-actual-classes
  compose:
    enabled: true
  jvm:
    jdk:
      version: 17
    release: 17
