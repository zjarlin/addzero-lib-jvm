product: jvm/lib
description: "`ktor-jimmer-plugin` 只负责三件事："

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml
  - //build-config/jvm-koin.module-template.yaml
  - //build-config/jimmer.module-template.yaml

dependencies:
  - //lib/tool-kmp/ktor/starter/starter-spi
  - $libs.io.ktor.ktor.server.core
  - $libs.io.insert.koin.koin.ktor
  - $libs.org.xerial.sqlite.jdbc.v3
  - $libs.org.postgresql.postgresql
  - site.addzero:ioc-core:2026.08.11

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: ktor-jimmer-plugin
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: ktor-jimmer-plugin
      description: "`ktor-jimmer-plugin` 只负责三件事："
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
