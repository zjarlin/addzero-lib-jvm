product: jvm/lib
description: "site.addzero:apt-ioc-processor"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - site.addzero:ioc-core:2026.08.11

test-dependencies:
  - site.addzero:ioc-core:2026.08.11

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: apt-ioc-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: apt-ioc-processor
      description: "site.addzero:apt-ioc-processor"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

test-settings:
  java:
    annotationProcessing:
      processors:
        - //lib/apt/apt-ioc-processor
