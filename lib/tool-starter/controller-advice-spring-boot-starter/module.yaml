product: jvm/lib
description: "site.addzero:controller-advice-spring-boot-starter"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml
  - //build-config/spring-starter.module-template.yaml

dependencies:
  - $libs.cn.hutool.hutool.all
  - $libs.com.fasterxml.jackson.module.jackson.module.kotlin
  - $libs.org.springframework.spring.webmvc
  - $libs.javax.servlet.javax.servlet.api:
      scope: compile-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: controller-advice-spring-boot-starter
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: controller-advice-spring-boot-starter
      description: "site.addzero:controller-advice-spring-boot-starter"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
