product: jvm/lib
description: "site.addzero:lsi-reflection"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/lsi/lsi-core
  - site.addzero:tool-str:2026.08.11

test-dependencies:
  - $libs.org.junit.platform.junit.platform.launcher:
      scope: runtime-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: lsi-reflection
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: lsi-reflection
      description: "site.addzero:lsi-reflection"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
