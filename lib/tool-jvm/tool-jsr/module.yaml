product: jvm/lib
description: "site.addzero:tool-jsr"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.javax.validation.validation.api
  - //lib/tool-jvm/tool-context:
      exported: true
  - //lib/tool-jvm/tool-reflection:
      exported: true
  - $libs.cn.hutool.hutool.all
  - $libs.com.alibaba.fastjson2.fastjson2.kotlin
  - $libs.org.springframework.spring.jdbc:
      scope: compile-only
  - $libs.org.springframework.spring.context:
      scope: compile-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-jsr
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-jsr
      description: "site.addzero:tool-jsr"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
