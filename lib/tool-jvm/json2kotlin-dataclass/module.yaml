product: jvm/lib
description: "JSON to Kotlin Data Class - 生成 data class 定义 + 实例赋值代码"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.google.code.gson.gson
  - $libs.site.addzero.tool.jvmstr

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: json2kotlin-dataclass
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: json2kotlin-dataclass
      description: "JSON to Kotlin Data Class - 生成 data class 定义 + 实例赋值代码"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
