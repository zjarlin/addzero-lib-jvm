product: jvm/lib
description: "AutoDDL 纯领域层：Schema 模型、Diff Planner、方言 SPI"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/tool-jvm/database/tool-database-model:
      exported: true

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: ddlgenerator-core
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: ddlgenerator-core
      description: "AutoDDL 纯领域层：Schema 模型、Diff Planner、方言 SPI"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
