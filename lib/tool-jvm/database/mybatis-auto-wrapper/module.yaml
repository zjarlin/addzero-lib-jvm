product: jvm/lib
description: "site.addzero:mybatis-auto-wrapper"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.cn.hutool.hutool.core
  - $libs.com.baomidou.mybatis.plus.core
  - //lib/tool-jvm/database/mybatis-auto-wrapper-core:
      exported: true
  - $libs.org.springframework.spring.expression
  - //lib/tool-jvm/tool-spel

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: mybatis-auto-wrapper
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: mybatis-auto-wrapper
      description: "site.addzero:mybatis-auto-wrapper"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
