product: jvm/lib
description: "site.addzero:tool-cte"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.org.springframework.spring.jdbc:
      scope: compile-only
  - $libs.org.springframework.spring.context:
      scope: compile-only
  - //lib/tool-jvm/database/tool-database-model:
      exported: true

test-dependencies:
  - $libs.org.springframework.spring.jdbc
  - $libs.mysql.mysql.connector.java
  - $libs.org.junit.jupiter.junit.jupiter
  - //lib/tool-jvm/database/tool-sql-executor

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-cte
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-cte
      description: "site.addzero:tool-cte"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
