product: jvm/lib
description: "site.addzero:tool-mybatis"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.baomidou.mybatis.plus:
      scope: compile-only
  - //lib/tool-jvm/database/mybatis-auto-wrapper
  - $libs.cn.hutool.hutool.core
  - //lib/tool-jvm/tool-spctx

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-mybatis
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-mybatis
      description: "site.addzero:tool-mybatis"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
