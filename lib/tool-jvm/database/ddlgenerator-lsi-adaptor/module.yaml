product: jvm/lib
description: "AutoDDL 的 LSI 输入适配层"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/tool-jvm/database/ddlgenerator-core:
      exported: true
  - //lib/lsi/lsi-core:
      exported: true
  - $libs.org.babyfish.jimmer.jimmer.core

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: ddlgenerator-lsi-adaptor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: ddlgenerator-lsi-adaptor
      description: "AutoDDL 的 LSI 输入适配层"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
