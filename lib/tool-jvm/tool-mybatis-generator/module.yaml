product: jvm/lib
description: "site.addzero:tool-mybatis-generator"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.cn.hutool.hutool.all
  - $libs.com.baomidou.mybatis.plus.generator
  - $libs.com.baomidou.mybatis.plus.annotation
  - $libs.com.baomidou.mybatis.plus.core
  - $libs.org.apache.velocity.velocity.engine.core
  - $libs.mysql.mysql.connector.java
  - //lib/tool-jvm/tool-yml
  - //lib/tool-jvm/tool-cli-repl

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-mybatis-generator
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-mybatis-generator
      description: "site.addzero:tool-mybatis-generator"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
