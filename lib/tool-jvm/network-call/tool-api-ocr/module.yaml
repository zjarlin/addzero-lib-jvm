product: jvm/lib
description: "site.addzero:tool-api-ocr"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.cn.hutool.hutool.all
  - $libs.com.alibaba.fastjson2.fastjson2.kotlin
  - //lib/tool-jvm/tool-curl
  - $libs.com.squareup.okhttp3.okhttp
  - $libs.com.fasterxml.jackson.module.jackson.module.kotlin

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-api-ocr
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-api-ocr
      description: "site.addzero:tool-api-ocr"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
