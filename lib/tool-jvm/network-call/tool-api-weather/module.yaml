product: jvm/lib
description: "site.addzero:tool-api-weather"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.alibaba.fastjson2.fastjson2.kotlin
  - $libs.org.jsoup.jsoup
  - $libs.cn.hutool.hutool.http
  - $libs.org.xerial.sqlite.jdbc.v3

test-dependencies:
  - $libs.cn.idev.excel.fastexcel

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-api-weather
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-api-weather
      description: "site.addzero:tool-api-weather"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
