product: jvm/lib
description: "site.addzero:tool-api-tyc-hw"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.alibaba.fastjson2.fastjson2.kotlin
  - $libs.site.addzero.huawei.java.sdk
  - $libs.org.apache.httpcomponents.httpclient
  - $libs.com.squareup.okhttp3.okhttp
  - $libs.com.squareup.okio.okio
  - $libs.org.apache.httpcomponents.httpcore
  - $libs.org.openeuler.bgmprovider
  - $libs.org.bouncycastle.bcprov.jdk15to18

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-api-tyc-hw
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-api-tyc-hw
      description: "site.addzero:tool-api-tyc-hw"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
