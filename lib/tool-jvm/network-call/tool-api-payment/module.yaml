product: jvm/lib
description: "统一的支付二维码与订单查询 SPI，当前内置："

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.alipay.easysdk
  - $libs.wechatpay.java

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-api-payment
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-api-payment
      description: "统一的支付二维码与订单查询 SPI，当前内置："
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
