product: jvm/lib
description: "Unified email verification-code access for temporary mailboxes and user-owned inboxes."

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.squareup.okhttp3.okhttp
  - $libs.com.fasterxml.jackson.module.jackson.module.kotlin
  - $libs.com.sun.mail.jakarta.mail

test-dependencies:
  - $libs.org.junit.jupiter.junit.jupiter
  - $libs.com.squareup.okhttp3.mockwebserver

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-api-email
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-api-email
      description: "Unified email verification-code access for temporary mailboxes and user-owned inboxes."
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
