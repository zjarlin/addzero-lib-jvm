product: jvm/lib
description: "site.addzero:tool-minio"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.io.minio.minio
  - $libs.cn.hutool.hutool.core
  - $libs.org.slf4j.slf4j.api

test-dependencies:
  - $libs.org.junit.jupiter.junit.jupiter.api
  - $libs.org.junit.jupiter.junit.jupiter.engine:
      scope: runtime-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-minio
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-minio
      description: "site.addzero:tool-minio"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
