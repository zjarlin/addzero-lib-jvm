product: jvm/lib
description: "site.addzero:tool-spctx"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml
  - //build-config/jvm-ksp-processor.module-template.yaml

dependencies:
  - site.addzero:gen-reified-core:2026.08.11:
      scope: compile-only
  - $libs.org.springframework.spring.context:
      scope: compile-only
  - $libs.org.springframework.spring.webmvc:
      scope: compile-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-spctx
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-spctx
      description: "site.addzero:tool-spctx"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
