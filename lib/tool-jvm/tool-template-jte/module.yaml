product: jvm/lib
description: "JTE Template Engine utilities"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.gg.jte.jte

test-dependencies:
  - $libs.org.jetbrains.kotlin.kotlin.test
  - $libs.org.junit.jupiter.junit.jupiter

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-template-jte
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-template-jte
      description: "JTE Template Engine utilities"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
