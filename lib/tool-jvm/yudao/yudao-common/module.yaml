product: jvm/lib
description: "site.addzero:yudao-common"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/yudao-java-starter.module-template.yaml

dependencies:
  - $libs.yudao.spring.core:
      scope: compile-only
  - $libs.yudao.spring.expression:
      scope: compile-only
  - $libs.yudao.spring.aop:
      scope: compile-only
  - $libs.yudao.aspectjweaver:
      scope: compile-only
  - $libs.yudao.spring.web:
      exported: true
      scope: compile-only
  - $libs.yudao.jakarta.servlet.api:
      exported: true
      scope: compile-only
  - $libs.yudao.springdoc.openapi.ui:
      exported: true
      scope: compile-only
  - $libs.yudao.spring.cloud.openfeign.core:
      exported: true
      scope: compile-only
  - $libs.yudao.guava:
      scope: compile-only
  - $libs.yudao.jackson.databind:
      scope: compile-only
  - $libs.yudao.jackson.core:
      scope: compile-only
  - $libs.yudao.jackson.datatype.jsr310:
      scope: compile-only
  - $libs.yudao.slf4j.api:
      scope: compile-only
  - $libs.yudao.jakarta.validation.api:
      exported: true
      scope: compile-only
  - $libs.yudao.easy.trans.anno:
      exported: true
  - $libs.yudao.apm.toolkit.trace
  - $libs.yudao.mapstruct
  - $libs.yudao.mapstruct.jdk8
  - $libs.yudao.hutool.all:
      exported: true
  - $libs.yudao.transmittable.thread.local:
      exported: true
  - $libs.yudao.jsoup

test-dependencies:
  - $libs.yudao.spring.boot.starter.test

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: yudao-common
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-common
      description: "site.addzero:yudao-common"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  java:
    annotationProcessing:
      processors:
        - $libs.yudao.mapstruct.processor
        - $libs.yudao.spring.boot.configuration.processor
