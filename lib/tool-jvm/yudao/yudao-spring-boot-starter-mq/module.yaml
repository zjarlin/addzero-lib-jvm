product: jvm/lib
description: "site.addzero:yudao-spring-boot-starter-mq"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/yudao-java-starter.module-template.yaml

dependencies:
  - //lib/tool-jvm/yudao/yudao-spring-boot-starter-redis:
      exported: true
  - $libs.yudao.spring.kafka:
      scope: compile-only
  - $libs.yudao.spring.rabbit:
      exported: true
  - $libs.yudao.rocketmq.spring.boot.starter:
      exported: true

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: yudao-spring-boot-starter-mq
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-spring-boot-starter-mq
      description: "site.addzero:yudao-spring-boot-starter-mq"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
