product: jvm/lib
description: "site.addzero:yudao-spring-boot-starter-security"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/yudao-java-starter.module-template.yaml

dependencies:
  - //lib/tool-jvm/yudao/yudao-common:
      exported: true
  - //lib/tool-jvm/yudao/yudao-spring-boot-starter-web:
      exported: true
  - $libs.yudao.spring.boot.starter.aop:
      exported: true
  - $libs.yudao.spring.boot.starter.security:
      exported: true
  - //lib/tool-jvm/yudao/yudao-spring-boot-starter-rpc:
      scope: compile-only
  - $libs.yudao.guava
  - $libs.yudao.bizlog.sdk

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: yudao-spring-boot-starter-security
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-spring-boot-starter-security
      description: "site.addzero:yudao-spring-boot-starter-security"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  java:
    annotationProcessing:
      processors:
        - $libs.yudao.spring.boot.configuration.processor
