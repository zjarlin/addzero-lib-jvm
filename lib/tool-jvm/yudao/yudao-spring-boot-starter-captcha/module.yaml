product: jvm/lib
description: "site.addzero:yudao-spring-boot-starter-captcha"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.anji.plus.captcha.spring.boot.starter:
      exported: true
  - $libs.cn.hutool.hutool.all:
      exported: true
  - $libs.org.springframework.spring.web:
      scope: compile-only
  - $libs.org.springframework.data.spring.data.redis:
      scope: compile-only

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: yudao-spring-boot-starter-captcha
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: yudao-spring-boot-starter-captcha
      description: "site.addzero:yudao-spring-boot-starter-captcha"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
