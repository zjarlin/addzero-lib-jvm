product: jvm/lib
description: "JVM Modbus 工具模块，当前提供面向 Kotlin 的 Modbus TCP 客户端与服务端封装，底层基于仓库已在使用的 `j2mod`。"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.j2mod:
      exported: true
  - //lib/tool-jvm/tool-serial:
      exported: true

test-dependencies:
  - $libs.org.jetbrains.kotlin.kotlin.test
  - $libs.org.junit.jupiter.junit.jupiter

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-modbus
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-modbus
      description: "JVM Modbus 工具模块，当前提供面向 Kotlin 的 Modbus TCP 客户端与服务端封装，底层基于仓库已在使用的 `j2mod`。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
