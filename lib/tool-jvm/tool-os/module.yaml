product: jvm/lib
description: "操作系统与平台路径工具。"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/tool-jvm/tool-cmd
  - $libs.cn.hutool.hutool.core
  - $libs.cn.hutool.hutool.system
  - site.addzero:tool-str:2026.08.11

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-os
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-os
      description: "操作系统与平台路径工具。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
