product: jvm/lib
description: "site.addzero:tool-ssh"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.org.jetbrains.kotlinx.kotlinx.coroutines.core
  - $libs.com.hierynomus.sshj
  - $libs.org.slf4j.slf4j.api

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-ssh
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-ssh
      description: "site.addzero:tool-ssh"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
