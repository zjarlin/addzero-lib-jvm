product: jvm/lib
description: "site.addzero:tool-excel"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.cn.idev.excel.fastexcel
  - $libs.cn.hutool.hutool.all
  - $libs.net.bytebuddy.byte.buddy
  - $libs.org.jetbrains.kotlin.kotlin.reflect
  - $libs.com.fasterxml.jackson.module.jackson.module.kotlin

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: tool-excel
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: tool-excel
      description: "site.addzero:tool-excel"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
