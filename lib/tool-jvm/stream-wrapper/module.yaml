product: jvm/lib
description: "site.addzero:stream-wrapper"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.com.baomidou.mybatis.plus.core
  - $libs.org.apache.commons.commons.lang3

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: stream-wrapper
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: stream-wrapper
      description: "site.addzero:stream-wrapper"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  lombok:
    enabled: true
    version: 1.18.46
