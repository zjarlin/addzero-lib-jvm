product: jvm/lib
description: "site.addzero:logger-processor"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml
  - //build-config/jvm-ksp-processor.module-template.yaml

dependencies:
  - //lib/ksp/logger-api

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: logger-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: logger-processor
      description: "site.addzero:logger-processor"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

test-settings:
  kotlin:
    ksp:
      version: 2.3.9
      processors:
        - //lib/ksp/logger-implementation
        - //lib/ksp/logger-processor
