product: jvm/lib
description: "Extract Ktor route metadata into in-memory OpenAPI-oriented data classes"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/ksp/metadata/openapi/openapi-core:
      exported: true
  - $libs.com.google.devtools.ksp.symbol.processing.api

test-dependencies:
  - $libs.io.ktor.ktor.server.core
  - $libs.io.ktor.ktor.server.websockets

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: openapi-ktor-extractor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: openapi-ktor-extractor
      description: "Extract Ktor route metadata into in-memory OpenAPI-oriented data classes"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
