product: jvm/lib
description: "site.addzero:jimmer-ddl-compiler-apt-smoke"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - $libs.org.babyfish.jimmer.jimmer.core

settings:
  publishing:
    enabled: false
    group: site.addzero
    artifactId: jimmer-ddl-compiler-apt-smoke
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: jimmer-ddl-compiler-apt-smoke
      description: "site.addzero:jimmer-ddl-compiler-apt-smoke"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  java:
    annotationProcessing:
      processors:
        - //lib/ksp/metadata/jimmer-ddl-compiler/jimmer-ddl-compiler-processor
