product: jvm/lib
description: "`modbus-codegen-core` 是不依赖 KSP 的纯 Kotlin 元数据处理模块。"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml
  - //build-config/jvm-json-withtool.module-template.yaml

test-dependencies:
  - $libs.org.jetbrains.kotlin.kotlin.test

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: modbus-codegen-core
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: modbus-codegen-core
      description: "`modbus-codegen-core` 是不依赖 KSP 的纯 Kotlin 元数据处理模块。"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
