product: jvm/lib
description: "site.addzero:spring2ktor-server-core"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - bom: $libs.io.insert.koin.koin.bom
  - $libs.io.insert.koin.koin.core:
      exported: true
  - $libs.io.ktor.ktor.server.core:
      exported: true
  - $libs.org.springframework.spring.web

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: spring2ktor-server-core
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: spring2ktor-server-core
      description: "site.addzero:spring2ktor-server-core"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
