product: jvm/lib
description: "site.addzero:multireceiver-processor"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - site.addzero:kcp-multireceiver-annotations:2026.08.11
  - $libs.com.google.devtools.ksp.symbol.processing.api

settings:
  publishing:
    enabled: true
    group: site.addzero
    artifactId: multireceiver-processor
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: multireceiver-processor
      description: "site.addzero:multireceiver-processor"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
