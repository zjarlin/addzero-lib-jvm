product: jvm/lib
description: "site.addzero:spring2ktor-server-smoke"

apply:
  - //build-config/jvm-lib.module-template.yaml
  - //build-config/jvm8.module-template.yaml

dependencies:
  - //lib/ksp/metadata/spring2ktor-server-core
  - $libs.io.ktor.ktor.server.content.negotiation
  - $libs.io.ktor.ktor.serialization.kotlinx.json
  - $libs.org.jetbrains.kotlinx.kotlinx.serialization.json
  - $libs.io.ktor.ktor.server.websockets
  - $libs.org.springframework.spring.web:
      scope: compile-only

test-dependencies:
  - $libs.io.ktor.ktor.client.websockets
  - $libs.io.ktor.ktor.server.status.pages
  - $libs.io.ktor.ktor.server.test.host.jvm

settings:
  publishing:
    enabled: false
    group: site.addzero
    artifactId: spring2ktor-server-smoke
    version: 2026.08.11
    publishSources: true
    signArtifacts: false
    mavenCentral:
      enabled: false
      publishingMode: auto
    pom:
      name: spring2ktor-server-smoke
      description: "site.addzero:spring2ktor-server-smoke"
      url: https://github.com/zjarlin/addzero-lib-jvm
      scm: https://github.com/zjarlin/addzero-lib-jvm.git
      developers:
        - id: zjarlin
          name: zjarlin
          email: zjarlin@outlook.com
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
  kotlin:
    serialization: enabled
    ksp:
      version: 2.3.9
      processors:
        - //lib/ksp/metadata/spring2ktor-server-processor
